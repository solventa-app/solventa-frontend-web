name: CI mobile

# No hace nada hasta que exista apps/mobile/pubspec.yaml (el móvil arranca en el Sprint 2).
# SIN PROBAR: este workflow no se ha ejecutado nunca; revisarlo en el primer PR del móvil.
# En PR corre siempre: el check `mobile` es obligatorio en `main` y `develop`, y un check filtrado por ruta
# nunca reportaría en los PRs que no tocan el móvil (sin pubspec.yaml el job no hace nada y termina en verde).
on:
  pull_request:
  push:
    branches: [main, develop]
    paths: ['apps/mobile/**', '.github/workflows/ci-mobile.yml']

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: ¿Existe el proyecto Flutter?
        id: proyecto
        run: |
          if [ -f pubspec.yaml ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.proyecto.outputs.existe == 'true'
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.proyecto.outputs.existe == 'true'
      - run: flutter analyze
        if: steps.proyecto.outputs.existe == 'true'
      - run: flutter test
        if: steps.proyecto.outputs.existe == 'true'
