name: E2E staging

# Manual: corre Cypress contra una URL desplegada (staging se publica desde el main de solventa-backend / este repo).
# SIN PROBAR: no se ha ejecutado nunca; revisarlo cuando exista staging.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL de la web a probar (p. ej. https://staging.ejemplo.com)
        required: true

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v7
        with:
          working-directory: e2e
          browser: chrome
        env:
          CYPRESS_BASE_URL: ${{ inputs.base_url }}
          CYPRESS_USUARIO_CLIENTE: ${{ secrets.CYPRESS_USUARIO_CLIENTE }}
          CYPRESS_CLAVE_CLIENTE: ${{ secrets.CYPRESS_CLAVE_CLIENTE }}
          CYPRESS_USUARIO_ASESOR: ${{ secrets.CYPRESS_USUARIO_ASESOR }}
          CYPRESS_CLAVE_ASESOR: ${{ secrets.CYPRESS_CLAVE_ASESOR }}
          CYPRESS_USUARIO_BACKOFFICE: ${{ secrets.CYPRESS_USUARIO_BACKOFFICE }}
          CYPRESS_CLAVE_BACKOFFICE: ${{ secrets.CYPRESS_CLAVE_BACKOFFICE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-evidencia
          path: |
            e2e/cypress/screenshots
            e2e/cypress/videos
            e2e/cypress/results
          if-no-files-found: ignore
