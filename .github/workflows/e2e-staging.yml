name: E2E staging

# Manual: corre Cypress contra una URL desplegada (staging se publica desde el main de solventa-backend / este repo).
# Los specs ya se ejecutaron contra los mocks (docs/evidencias/FC-01-2026-10-18.md); este workflow aún no se ha corrido contra staging.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL de la web a probar (p. ej. https://staging.ejemplo.com)
        required: true

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          working-directory: e2e
          browser: chrome
        env:
          CYPRESS_BASE_URL: ${{ inputs.base_url }}
          CYPRESS_USUARIO_CLIENTE: ${{ secrets.CYPRESS_USUARIO_CLIENTE }}
          CYPRESS_CLAVE_CLIENTE: ${{ secrets.CYPRESS_CLAVE_CLIENTE }}
          CYPRESS_USUARIO_ASESOR: ${{ secrets.CYPRESS_USUARIO_ASESOR }}
          CYPRESS_CLAVE_ASESOR: ${{ secrets.CYPRESS_CLAVE_ASESOR }}
          CYPRESS_USUARIO_BACKOFFICE: ${{ secrets.CYPRESS_USUARIO_BACKOFFICE }}
          CYPRESS_CLAVE_BACKOFFICE: ${{ secrets.CYPRESS_CLAVE_BACKOFFICE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cypress-evidencia
          path: |
            e2e/cypress/screenshots
            e2e/cypress/videos
            e2e/cypress/results
          if-no-files-found: ignore
