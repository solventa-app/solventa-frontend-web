name: E2E staging

# Manual: corre Cypress contra una URL desplegada (staging se publica desde el main de solventa-backend / este repo).
# SIN PROBAR: no se ha ejecutado nunca; revisarlo cuando exista staging.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL de la web a probar (p. ej. https://staging.ejemplo.com)
        required: true

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v7
        with:
          working-directory: e2e
          browser: chrome
        env:
          CYPRESS_BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-capturas
          path: e2e/cypress/screenshots
          if-no-files-found: ignore
