name: Título del PR

# El título del PR es el mensaje del commit al hacer squash a develop (git-flow, 1 PR = 1 historia):
# Conventional Commits con alcance y clave de Jira. Ver docs/convenciones.md.
# Va en un workflow aparte para que editar el título no vuelva a correr todo el CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  titulo:
    name: Título del PR
    # Dependabot usa su propio formato. Se compara el autor del PR, no github.actor: un "Update branch"
    # (gh pr update-branch, o el botón en GitHub) dispara `synchronize` con el actor de quien lo pidió, no
    # el de Dependabot, y github.actor != 'dependabot[bot]' dejaría de exentar el PR en ese caso.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar formato
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          patron='^(feat|fix|refactor|test|docs|chore|ci|infra)\((web|mobile|e2e|contrato|docs|ci)\): KAN-[0-9]+ .+'
          if ! printf '%s' "$TITULO" | grep -Eq "$patron"; then
            echo "::error title=Título del PR::Formato esperado: tipo(alcance): KAN-N descripción. Ej.: feat(web): KAN-24 formulario de captura con consentimiento"
            echo "Recibido: $TITULO"
            echo "Tipos: feat fix refactor test docs chore ci infra"
            echo "Alcances: web mobile e2e contrato docs ci"
            exit 1
          fi
