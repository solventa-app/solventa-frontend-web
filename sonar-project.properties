sonar.organization=global-spark
sonar.projectKey=global-spark_solventa-frontend
sonar.projectName=Solventa Frontend
sonar.host.url=https://sonarcloud.io
sonar.sources=apps/web/src
sonar.tests=apps/web/tests,e2e/cypress
# Generados por `npm run codegen` (GraphQL y la API de socios): no se analizan.
sonar.exclusions=apps/web/src/graphql/tipos.ts,apps/web/src/api/tipos-socios.ts,apps/web/public/**,**/node_modules/**
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
# es.ts y en.ts son tablas de traducción con las mismas claves a propósito (una prueba exige que
# coincidan): se excluyen solo de la detección de duplicados.
sonar.cpd.exclusions=apps/web/src/i18n/es.ts,apps/web/src/i18n/en.ts
