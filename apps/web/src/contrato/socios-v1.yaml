# BORRADOR LOCAL del contrato de la API de socios (HU-W07, KAN-30). NO es una copia del backend.
#
# Existe para construir el portal de socios con mocks mientras el backend no publique
# `contracts/openapi/socios-v1.yaml` (bloque 1 de solventa-backend/docs/plan-completar-hu-w07.md, rama
# feat/KAN-30-socios-api). Mismo patrón que el borrador de W03 (decisión D-1). Los endpoints y los campos que nombra el
# plan se copian tal cual; lo que el plan no fija va marcado «Propuesta del borrador» y se avisa al backend. Cuando se
# publique el contrato real: se borra este archivo, se copia el del backend y se regeneran los tipos
# (`npm run codegen` → src/api/tipos-socios.ts).
#
# Pendiente en el backend (decisión abierta del plan): cómo se identifica al cliente final del socio. Puede cambiar los
# campos de `consentimientos` y `propuestas`; el portal no los usa, solo el Swagger de W07-03.
openapi: 3.0.3
info:
  title: Solventa · API de socios de distribución
  version: 1.0.0-borrador
  description: >-
    API exclusiva para socios de distribución: cotizar y vender la póliza de Vida Hipotecario de Solventa desde la app
    del socio. Los montos van como texto decimal con su moneda. Nunca responde un 5xx crudo; si las fuentes fallan, la
    oferta es PRELIMINAR. Los errores siguen la forma de `ErrorPublico`, en el idioma de `Accept-Language`.
    Con un token de PRUEBAS las respuestas son simuladas (propuesta del borrador): un documento terminado en 999 recibe
    una oferta PRELIMINAR, cualquier otro una COMPLETA, y el código de verificación del titular es siempre 000000.
servers:
  - url: /v1
security:
  - tokenSocio: []
tags:
  - name: Acceso
  - name: Consentimiento
  - name: Cotización
  - name: Propuesta
  - name: Póliza
  - name: Cuenta

paths:
  /token:
    post:
      tags: [Acceso]
      summary: Pide un token de 15 minutos con el ID de socio y la clave de un entorno
      operationId: solicitarToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudToken' }
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '423': { $ref: '#/components/responses/Bloqueado' }

  /consentimientos:
    post:
      tags: [Consentimiento]
      summary: Registra el consentimiento del titular antes de cotizar
      operationId: registrarConsentimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudConsentimiento' }
      responses:
        '201':
          description: Consentimiento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /consentimientos/{id}/revocar:
    post:
      tags: [Consentimiento]
      summary: Revoca un consentimiento
      operationId: revocarConsentimiento
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Consentimiento revocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /cotizaciones:
    post:
      tags: [Cotización]
      summary: Cotiza la póliza (descuenta una unidad del presupuesto)
      operationId: cotizar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCotizacion' }
      responses:
        '200':
          description: Oferta COMPLETA o PRELIMINAR, con las cotizaciones restantes del presupuesto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '429': { $ref: '#/components/responses/PresupuestoAgotado' }

  /propuestas:
    post:
      tags: [Propuesta]
      summary: Acepta una oferta y crea la propuesta
      operationId: crearPropuesta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudPropuesta' }
      responses:
        '201':
          description: Propuesta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Propuesta' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /propuestas/{id}:
    get:
      tags: [Propuesta]
      summary: Consulta el estado de una propuesta (consulta periódica, sin webhooks)
      operationId: consultarPropuesta
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: La propuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Propuesta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /propuestas/{id}/documento-firma:
    get:
      tags: [Propuesta]
      summary: Documento que firmará el titular
      operationId: documentoFirma
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Versión y URL del documento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoFirma' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /propuestas/{id}/solicitud-firma:
    post:
      tags: [Propuesta]
      summary: Pide el enlace de firma para el titular
      operationId: solicitarFirma
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudFirma' }
      responses:
        '200':
          description: Enlace de firma del proveedor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnlaceFirma' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /polizas/{id}:
    get:
      tags: [Póliza]
      summary: Consulta una póliza emitida
      operationId: consultarPoliza
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: La póliza
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poliza' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /polizas/{id}/documento:
    get:
      tags: [Póliza]
      summary: PDF de la póliza
      operationId: documentoPoliza
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /credenciales:
    get:
      tags: [Cuenta]
      summary: Las credenciales del socio por entorno
      operationId: credenciales
      responses:
        '200':
          description: El socio y sus credenciales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credenciales' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /credenciales/{entorno}/rotar:
    post:
      tags: [Cuenta]
      summary: Regenera la clave de un entorno (la anterior deja de servir)
      operationId: rotarCredencial
      parameters:
        - name: entorno
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Entorno' }
      responses:
        '200':
          description: La credencial nueva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credencial' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /consumo:
    get:
      tags: [Cuenta]
      summary: Presupuesto de cotizaciones y llamadas por API
      operationId: consumo
      parameters:
        - { $ref: '#/components/parameters/EntornoConsulta' }
        - { $ref: '#/components/parameters/Ventana' }
      responses:
        '200':
          description: El consumo del entorno en la ventana
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consumo' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /estado:
    get:
      tags: [Cuenta]
      summary: Salud general del servicio y de cada API (sin nombres de micros internos)
      operationId: estado
      parameters:
        - { $ref: '#/components/parameters/Ventana' }
      responses:
        '200':
          description: El estado en la ventana
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estado' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /ventas:
    get:
      tags: [Cuenta]
      summary: Propuestas, pólizas, primas cobradas y comisión causada por mes
      operationId: ventas
      parameters:
        - { $ref: '#/components/parameters/EntornoConsulta' }
      responses:
        '200':
          description: Las ventas del entorno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ventas' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

components:
  securitySchemes:
    tokenSocio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de 15 minutos de `POST /v1/token`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    EntornoConsulta:
      name: entorno
      in: query
      required: false
      description: Por defecto, el entorno del token.
      schema: { $ref: '#/components/schemas/Entorno' }
    Ventana:
      name: ventana
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Ventana' }

  responses:
    Invalido:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPublico' }
    NoAutorizado:
      description: Token ausente o vencido, o ID de socio y clave incorrectos (mensaje genérico)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPublico' }
    Bloqueado:
      description: Propuesta del borrador. Demasiados intentos fallidos con ese ID de socio
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPublico' }
    NoEncontrado:
      description: No existe o no la vendió este socio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPublico' }
    PresupuestoAgotado:
      description: El presupuesto de cotizaciones se agotó (código PRESUPUESTO_AGOTADO). Solo en cotizaciones
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPublico' }

  schemas:
    Entorno:
      type: string
      enum: [PRODUCCION, PRUEBAS]
    Ventana:
      type: string
      enum: ['15m', '1h', '24h', '7d']
      default: '1h'
    Color:
      type: string
      enum: [VERDE, AMARILLO, ROJO]
      description: Verde ≥ 90, amarillo ≥ 70, rojo < 70.
    Monto:
      type: object
      required: [valor, moneda]
      properties:
        valor: { type: string, example: '185000' }
        moneda: { type: string, example: COP }
    ErrorPublico:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: PRESUPUESTO_AGOTADO }
        mensaje: { type: string }

    SolicitudToken:
      type: object
      required: [socioId, clave]
      properties:
        socioId: { type: string, example: retail-fintech-042 }
        clave: { type: string, description: La clave larga del entorno. El entorno del token sale de la clave. }
    Token:
      type: object
      required: [token, tipo, expiraEn, entorno, socio]
      properties:
        token: { type: string, description: JWT ES256 de 15 minutos }
        tipo: { type: string, enum: [Bearer] }
        expiraEn: { type: string, format: date-time }
        entorno: { $ref: '#/components/schemas/Entorno' }
        socio: { $ref: '#/components/schemas/Socio' }
    Socio:
      type: object
      description: Propuesta del borrador. El portal necesita el nombre para el encabezado.
      required: [id, nombre]
      properties:
        id: { type: string }
        nombre: { type: string, example: Retail Fintech S.A.S. }

    SolicitudConsentimiento:
      type: object
      required: [documentoIdentidad, finalidad, versionTexto]
      properties:
        documentoIdentidad: { type: string }
        finalidad: { type: string }
        versionTexto: { type: string }
    Consentimiento:
      type: object
      required: [id, estado, venceEn]
      properties:
        id: { type: string }
        estado: { type: string, enum: [VIGENTE, REVOCADO, VENCIDO] }
        venceEn: { type: string, format: date-time }

    SolicitudCotizacion:
      type: object
      required: [consentimientoId, documentoIdentidad, valorCredito, plazoMeses, direccionInmueble]
      properties:
        consentimientoId: { type: string }
        documentoIdentidad: { type: string }
        valorCredito: { $ref: '#/components/schemas/Monto' }
        plazoMeses: { type: integer, minimum: 1, maximum: 360 }
        direccionInmueble: { type: string }
    Cotizacion:
      type: object
      required: [oferta, restantes]
      properties:
        oferta: { $ref: '#/components/schemas/Oferta' }
        restantes: { type: integer, description: Cotizaciones que quedan en el presupuesto }
    Oferta:
      type: object
      required: [id, tipo, prima, cobertura, venceEn]
      properties:
        id: { type: string }
        tipo: { type: string, enum: [COMPLETA, PRELIMINAR] }
        prima: { $ref: '#/components/schemas/Monto' }
        cobertura: { $ref: '#/components/schemas/Monto' }
        venceEn: { type: string, format: date-time }

    SolicitudPropuesta:
      type: object
      required: [ofertaId]
      properties:
        ofertaId: { type: string }
    Propuesta:
      type: object
      required: [id, estado]
      properties:
        id: { type: string }
        estado:
          type: string
          enum:
            [ACEPTADA, IDENTIDAD_VERIFICADA, EN_FIRMA, FIRMADA, PENDIENTE_PAGO, EMITIDA, NO_EMITIDA, PAGO_RECHAZADO,
             CANCELADA]
        polizaId: { type: string, nullable: true }
    DocumentoFirma:
      type: object
      required: [version, url]
      properties:
        version: { type: string }
        url: { type: string }
    SolicitudFirma:
      type: object
      required: [autorizaCobro, versionDocumento]
      properties:
        autorizaCobro: { type: boolean }
        versionDocumento: { type: string }
    EnlaceFirma:
      type: object
      required: [urlFirma, expiraEn]
      properties:
        urlFirma: { type: string }
        expiraEn: { type: string, format: date-time }
    Poliza:
      type: object
      required: [id, numero, estado, vigenciaDesde, vigenciaHasta, prima, cobertura]
      properties:
        id: { type: string }
        numero: { type: string }
        estado: { type: string, enum: [EMITIDA, CANCELADA] }
        vigenciaDesde: { type: string, format: date-time }
        vigenciaHasta: { type: string, format: date-time }
        prima: { $ref: '#/components/schemas/Monto' }
        cobertura: { $ref: '#/components/schemas/Monto' }

    Credenciales:
      type: object
      required: [socio, entornos]
      properties:
        socio: { $ref: '#/components/schemas/Socio' }
        entornos:
          type: array
          items: { $ref: '#/components/schemas/Credencial' }
    Credencial:
      type: object
      description: >-
        Una por entorno: el ID con el que se pide el token y la clave larga (AUTH la guarda cifrada para poder
        mostrarla en el portal).
      required: [entorno, socioId, clave, creadaEn]
      properties:
        entorno: { $ref: '#/components/schemas/Entorno' }
        socioId: { type: string }
        clave: { type: string }
        creadaEn: { type: string, format: date-time }

    Consumo:
      type: object
      required: [entorno, ventana, presupuesto, porApi, cotizacionesPorDia]
      properties:
        entorno: { $ref: '#/components/schemas/Entorno' }
        ventana: { $ref: '#/components/schemas/Ventana' }
        presupuesto: { $ref: '#/components/schemas/Presupuesto' }
        porApi:
          type: array
          items: { $ref: '#/components/schemas/ConsumoApi' }
        cotizacionesPorDia:
          type: array
          description: Propuesta del borrador. Últimos días, para el gráfico del panel.
          items: { $ref: '#/components/schemas/ConteoDia' }
    Presupuesto:
      type: object
      description: Solo las cotizaciones descuentan. No se renueva solo; lo recarga Solventa.
      required: [asignadas, consumidas, restantes]
      properties:
        asignadas: { type: integer }
        consumidas: { type: integer }
        restantes: { type: integer }
    ConsumoApi:
      type: object
      required: [api, llamadas, exitosas, conError]
      properties:
        api: { type: string, enum: [cotizaciones, consentimientos, propuestas, firma, polizas] }
        llamadas: { type: integer }
        exitosas: { type: integer }
        conError: { type: integer }
        latenciaMediaMs: { type: number, nullable: true }
    ConteoDia:
      type: object
      required: [fecha, cantidad]
      properties:
        fecha: { type: string, format: date }
        cantidad: { type: integer }

    Estado:
      type: object
      required: [general, apis, verificadoEn]
      properties:
        general: { $ref: '#/components/schemas/SaludGeneral' }
        apis:
          type: array
          items: { $ref: '#/components/schemas/SaludApi' }
        verificadoEn: { type: string, format: date-time }
    SaludGeneral:
      type: object
      description: >-
        Disponibilidad y latencia media consolidadas del gateway. Sin métricas (solo `/health`) o sin tráfico, llegan en
        null.
      required: [porcentaje, color, ventana]
      properties:
        porcentaje: { type: number, minimum: 0, maximum: 100 }
        color: { $ref: '#/components/schemas/Color' }
        disponibilidad: { type: number, nullable: true, minimum: 0, maximum: 100 }
        latenciaMediaMs: { type: number, nullable: true }
        ventana: { $ref: '#/components/schemas/Ventana' }
    SaludApi:
      type: object
      required: [api, porcentaje, color]
      properties:
        api: { type: string, enum: [COTIZACION, EMISION] }
        porcentaje: { type: number, minimum: 0, maximum: 100 }
        color: { $ref: '#/components/schemas/Color' }

    Ventas:
      type: object
      required: [entorno, simulado, propuestasPorEstado, polizasEmitidas, conversion, primasCobradas, comisionCausada, porMes]
      properties:
        entorno: { $ref: '#/components/schemas/Entorno' }
        simulado: { type: boolean, description: true en PRUEBAS (comisiones ficticias del modo prueba) }
        propuestasPorEstado:
          type: array
          items:
            type: object
            required: [estado, cantidad]
            properties:
              estado: { type: string }
              cantidad: { type: integer }
        polizasEmitidas: { type: integer }
        conversion: { type: number, description: Pólizas emitidas / cotizaciones, de 0 a 1 }
        primasCobradas: { $ref: '#/components/schemas/Monto' }
        comisionCausada: { $ref: '#/components/schemas/Monto' }
        porMes:
          type: array
          items: { $ref: '#/components/schemas/VentasMes' }
    VentasMes:
      type: object
      required: [mes, polizasEmitidas, primasCobradas, comisionCausada]
      properties:
        mes: { type: string, example: '2026-10' }
        polizasEmitidas: { type: integer }
        primasCobradas: { $ref: '#/components/schemas/Monto' }
        comisionCausada: { $ref: '#/components/schemas/Monto' }
